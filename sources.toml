# Default source catalog for zectrix-ai-daily.
# URLs were checked on 2026-10-14. Dead feeds are omitted on purpose.
# Copy this file to $ZECTRIX_APP_DATA/sources.toml to override without rebuilding.
# `enabled` is the default; the settings page stores per-source overrides.
#
# Dropped after checks:
# - Anthropic: https://www.anthropic.com/rss.xml and /news/rss.xml return 404.
#   No public RSS/Atom feed was found.
# - Meta AI: https://ai.meta.com/blog/rss/ returns 404.
# - 机器之心 official https://www.jiqizhixin.com/rss returns an HTML page, not a feed.
#   The jiqizhixin entry below is a public WeChat-channel mirror (not operated
#   by 机器之心). Replace `url` if you host another feed.

